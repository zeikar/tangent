<title>__TITLE__</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=JetBrains+Mono:wght@400;600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.11/katex.min.js"></script>
<style>
:root {
  color-scheme: dark;
  --bg: #0F1115;
  --surface: #161920;
  --surface-2: #1D212A;
  --line: #2A2F38;
  --text: #F2F2F2;
  --muted: #8A8F98;
  --blue: #58C4DD;
  --yellow: #F4D345;
  --teal: #5CD0B3;
  --red: #FC6255;
  --purple: #9A72AC;
  --sans: "Noto Sans KR", "Apple SD Gothic Neo", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  padding-inline: 16px;
  padding-block: 0 64px;
}
.wrap { max-width: 1040px; margin-inline: auto; }
header.top { padding-block: 40px 20px; display: grid; gap: 14px; }
.eyebrow { font-family: var(--mono); font-size: 12px; letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
h1 { margin: 0; font-size: clamp(28px, 5vw, 44px); font-weight: 900; line-height: 1.15; text-wrap: balance; }
h1 .root { color: var(--yellow); }
.meta { display: flex; flex-wrap: wrap; gap: 8px 20px; color: var(--muted); font-size: 14px; font-variant-numeric: tabular-nums; }
.meta b { color: var(--text); font-weight: 600; }
.legend { display: flex; flex-wrap: wrap; gap: 8px; }
.legend span { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; padding: 4px 10px 4px 8px; border: 1px solid var(--line); border-radius: 999px; color: var(--text); }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* Sticky player */
.player {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: color-mix(in srgb, var(--bg) 92%, transparent);
  backdrop-filter: blur(8px);
  border-bottom: 1px solid var(--line);
  padding-block: 12px;
  display: grid; grid-template-columns: auto 1fr; gap: 16px; align-items: center;
}
.phone {
  width: 108px; aspect-ratio: 9 / 16; max-width: 100%;
  background: #000; border: 1px solid var(--line); border-radius: 10px;
  position: relative; overflow: hidden;
}
.phone .zone { position: absolute; left: 5.5%; right: 13%; top: 12.5%; height: 52.6%; border: 1px dashed var(--line); border-radius: 4px; display: grid; place-items: center; color: var(--muted); font-family: var(--mono); font-size: 9px; text-align: center; padding: 2px; }
.phone .cap { position: absolute; left: 5.5%; right: 13%; top: 66.7%; height: 11.5%; display: grid; place-items: center; text-align: center; font-size: 9px; font-weight: 700; line-height: 1.25; color: var(--text); }
.controls { display: grid; gap: 10px; min-width: 0; }
.row1 { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
button.play {
  font: 600 14px var(--sans); color: var(--bg); background: var(--yellow);
  border: 0; border-radius: 999px; padding: 8px 16px; cursor: pointer;
}
button.play:focus-visible, .seg:focus-visible, .word:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.clock { font-family: var(--mono); font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nowcap { font-weight: 700; font-size: 16px; min-height: 1.5em; }
.bar { display: flex; height: 28px; border-radius: 6px; overflow: hidden; border: 1px solid var(--line); position: relative; }
.seg {
  display: grid; place-items: center; font: 600 11px var(--mono); color: var(--muted);
  background: var(--surface); border: 0; border-right: 1px solid var(--line); cursor: pointer; padding: 0; min-width: 0;
}
.seg:last-child { border-right: 0; }
.seg.on { background: var(--surface-2); color: var(--text); }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--yellow); left: 0; pointer-events: none; }
.note-audio { font-size: 12px; color: var(--muted); }

/* Beats */
section.beat { display: grid; grid-template-columns: 88px 1fr; gap: 20px; padding-block: 28px; border-bottom: 1px solid var(--line); scroll-margin-top: 150px; }
.rail { display: grid; align-content: start; gap: 4px; }
.rail .id { font: 600 22px var(--mono); }
.rail .nm { font-weight: 700; }
.rail .sec { font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.body { display: grid; gap: 16px; min-width: 0; }
.label { font: 600 11px var(--mono); letter-spacing: .08em; color: var(--muted); text-transform: uppercase; }
.caps { display: flex; flex-wrap: wrap; gap: 8px; }
.caps .c { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; font-weight: 700; font-size: 16px; }
.caps .c small { display: block; font: 11px var(--mono); color: var(--muted); font-weight: 400; }
.caps .c.live { border-color: var(--yellow); }
.score { display: flex; flex-wrap: wrap; gap: 10px 6px; align-items: flex-start; }
.word { display: grid; gap: 4px; justify-items: start; background: none; border: 0; padding: 0; color: inherit; font: inherit; text-align: left; cursor: pointer; }
.word .w { font-size: 17px; font-weight: 500; padding: 2px 8px; border-radius: 6px; background: var(--surface); border: 1px solid transparent; }
.word.live .w { border-color: var(--yellow); color: var(--yellow); }
.word.pause .w { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.cues { display: grid; gap: 3px; }
.cue { font: 11px var(--mono); padding: 2px 6px; border-radius: 4px; background: var(--surface-2); color: var(--muted); white-space: nowrap; border-left: 3px solid var(--dot, var(--line)); }
.cue b { color: var(--text); font-weight: 600; }
.word.live .cue { color: var(--text); background: color-mix(in srgb, var(--dot, var(--line)) 22%, var(--surface-2)); }
.end { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 14px; color: var(--text); max-width: 72ch; }
.claims { display: flex; gap: 6px; flex-wrap: wrap; }
.claims span { font: 12px var(--mono); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; color: var(--muted); }

section.comps { padding-block: 32px; display: grid; gap: 16px; }
h2 { margin: 0; font-size: 22px; font-weight: 900; }
.comp { display: grid; grid-template-columns: 150px 1fr; gap: 16px; padding-block: 12px; border-top: 1px solid var(--line); }
.comp .n { font: 600 14px var(--mono); }
.comp .n small { display: block; color: var(--muted); font-weight: 400; }
.comp p { margin: 0; color: var(--muted); font-size: 14px; max-width: 80ch; }
math { font-size: 1.1em; }

@media (max-width: 640px) {
  section.beat { grid-template-columns: 1fr; gap: 10px; }
  .rail { grid-template-columns: auto auto 1fr; align-items: baseline; gap: 10px; }
  .comp { grid-template-columns: 1fr; gap: 4px; }
  .phone { width: 72px; }
  .player { gap: 12px; }
}
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
</style>

<div class="wrap">
  <header class="top">
    <div class="eyebrow">tangent · __SLUG__ · storyboard</div>
    <h1 id="h1"></h1>
    <div class="meta" id="meta"></div>
    <div class="legend" id="legend"></div>
  </header>

  <div class="player">
    <div class="phone" aria-hidden="true">
      <div class="zone" id="zoneTxt">visual zone</div>
      <div class="cap" id="phoneCap"></div>
    </div>
    <div class="controls">
      <div class="row1">
        <button class="play" id="play" type="button">▶ 내레이션 재생</button>
        <span class="clock" id="clock">0.0 / 0.0초</span>
        <span class="nowcap" id="nowcap"></span>
      </div>
      <div class="bar" id="bar"><div class="playhead" id="head"></div></div>
      <div class="note-audio">__AUDIO_NOTE__ 단어를 누르면 거기서부터 재생돼요.</div>
    </div>
  </div>

  <main id="beats"></main>

  <section class="comps">
    <div class="label">영상 제작 에이전트가 만들 부품</div>
    <h2>부품</h2>
    <div id="comps"></div>
  </section>
</div>

<audio id="audio" preload="auto" src="data:audio/mpeg;base64,__AUDIO__"></audio>
<script id="sb" type="application/json">__STORYBOARD__</script>
<script id="words" type="application/json">__WORDS__</script>
<script>
const sb = JSON.parse(document.getElementById('sb').textContent);
const aligned = JSON.parse(document.getElementById('words').textContent);
const RATE = 5.3;
const COLORS = ['text','muted','blue','yellow','teal','red','purple'];
const colorVar = n => COLORS.includes(n) ? `var(--${n})` : null;
const strip = s => s.replace(/[.,?!…]/g, '');

// Math: KaTeX's MathML output needs no stylesheet or fonts, which the artifact CSP would block.
function rich(text) {
  const out = document.createDocumentFragment();
  text.split(/(\$[^$]+\$)/).forEach(part => {
    if (part.startsWith('$') && part.endsWith('$') && part.length > 1) {
      const span = document.createElement('span');
      try { span.innerHTML = katex.renderToString(part.slice(1, -1), { output: 'mathml', throwOnError: false }); }
      catch (e) { span.textContent = part; }
      out.append(span);
    } else if (part) out.append(document.createTextNode(part));
  });
  return out;
}

// Which element color does a cue belong to?
const elColor = {};
sb.beats.forEach(b => (b.elements || []).forEach(e => {
  const p = e.props || {};
  elColor[e.id] = colorVar(p.color) || colorVar(p.stroke) || colorVar(p.fill) || null;
}));

// Map the aligned table-read words onto beats.
let gi = 0;
const beats = sb.beats.map(b => {
  const words = b.readAloud.split(/\s+/).filter(Boolean).map(w => ({ w, t: aligned[gi++]?.start ?? null }));
  const syl = (b.readAloud.match(/[가-힣]/g) || []).length;
  return { ...b, words, syl, est: syl / RATE + (b.pauseAfter || 0) };
});
const total = beats.reduce((s, b) => s + b.est, 0);

function anchorIndex(b, at) {
  if (!at || at.pause) return -1; // -1 = the beat's trailing pause
  let n = at.nth || 1;
  for (let i = 0; i < b.words.length; i++) if (strip(b.words[i].w) === strip(at.word) && --n === 0) return i;
  return null;
}

// Header
document.getElementById('meta').innerHTML =
  `<span><b>${beats.length}</b> 비트</span><span><b>${beats.reduce((s, b) => s + b.syl, 0)}</b> 음절</span>` +
  `<span>예상 <b>${total.toFixed(1)}</b>초</span><span>오디오 <b>${aligned.at(-1).end.toFixed(1)}</b>초</span><span>1080 × 1920 · 30 fps</span>`;
const legend = document.getElementById('legend');
document.getElementById('h1').append(rich(__H1__));
Object.entries(sb.colors || {}).forEach(([k, v]) => {
  const s = document.createElement('span');
  s.innerHTML = `<i style="background:${colorVar(k) || k}"></i>`;
  s.append(v.length > 30 ? v.slice(0, 28) + '…' : v);
  s.title = v;
  legend.append(s);
});

// Beat bar
const bar = document.getElementById('bar');
beats.forEach(b => {
  const s = document.createElement('button');
  s.className = 'seg'; s.type = 'button'; s.textContent = b.id; s.style.flex = b.est;
  s.addEventListener('click', () => { document.getElementById(b.id).scrollIntoView({ behavior: 'smooth' }); seek(b.words[0].t); });
  b.seg = s; bar.append(s);
});

// Beat sections
const main = document.getElementById('beats');
beats.forEach(b => {
  const sec = document.createElement('section');
  sec.className = 'beat'; sec.id = b.id;
  sec.innerHTML = `<div class="rail"><div class="id">${b.id}</div><div class="nm"></div><div class="sec">~${b.est.toFixed(1)}초${b.pauseAfter ? ` · 여백 ${b.pauseAfter}초` : ''}</div></div><div class="body"></div>`;
  sec.querySelector('.nm').textContent = b.name;
  const body = sec.querySelector('.body');

  const capL = document.createElement('div'); capL.className = 'label'; capL.textContent = '자막';
  const caps = document.createElement('div'); caps.className = 'caps';
  b.capEls = (b.captions || []).map(c => {
    const d = document.createElement('div'); d.className = 'c';
    d.append(rich(c.text));
    const sm = document.createElement('small'); sm.textContent = `@ ${c.at?.word ?? '…'}`; d.append(sm);
    caps.append(d);
    return { el: d, idx: anchorIndex(b, c.at), text: c.text };
  });

  const scL = document.createElement('div'); scL.className = 'label'; scL.textContent = '나레이션과 애니메이션 (단어가 발음되는 순간 시작)';
  const score = document.createElement('div'); score.className = 'score';
  const slots = b.words.map((wd, i) => {
    const btn = document.createElement('button'); btn.className = 'word'; btn.type = 'button';
    btn.innerHTML = '<span class="w"></span><div class="cues"></div>';
    btn.querySelector('.w').textContent = wd.w;
    btn.addEventListener('click', () => seek(wd.t));
    score.append(btn); wd.el = btn; return btn;
  });
  const pauseSlot = document.createElement('div'); pauseSlot.className = 'word pause';
  pauseSlot.innerHTML = `<span class="w">⏸ ${b.pauseAfter ? b.pauseAfter + '초' : '끝'}</span><div class="cues"></div>`;
  score.append(pauseSlot); b.pauseEl = pauseSlot;
  b.cues.forEach(c => {
    const i = anchorIndex(b, c.at);
    const host = i === -1 ? pauseSlot : (i === null ? pauseSlot : slots[i]);
    const tag = document.createElement('div'); tag.className = 'cue';
    const col = elColor[c.target]; if (col) tag.style.setProperty('--dot', col);
    tag.innerHTML = `<b></b> · <span></span>`;
    tag.querySelector('b').textContent = c.target;
    tag.querySelector('span').textContent = c.action + (c.until ? ` → ${c.until.word ?? '여백'}` : '');
    if (c.note) tag.title = c.note;
    host.querySelector('.cues').append(tag);
  });

  const endL = document.createElement('div'); endL.className = 'label'; endL.textContent = '마지막 프레임 (품질 검수 기준)';
  const end = document.createElement('div'); end.className = 'end'; end.textContent = b.endFrame;
  const cl = document.createElement('div'); cl.className = 'claims';
  (b.claims || []).forEach(x => { const s = document.createElement('span'); s.textContent = x; cl.append(s); });

  body.append(capL, caps, scL, score, endL, end, cl);
  main.append(sec);
});

// Components
const comps = document.getElementById('comps');
(sb.components || []).forEach(c => {
  const d = document.createElement('div'); d.className = 'comp';
  d.innerHTML = '<div class="n"><span></span><small></small></div><p></p>';
  d.querySelector('.n span').textContent = c.name;
  d.querySelector('.n small').textContent = c.status;
  d.querySelector('p').textContent = c.spec;
  comps.append(d);
});

// Playback sync
const audio = document.getElementById('audio');
const playBtn = document.getElementById('play');
const clock = document.getElementById('clock');
const head = document.getElementById('head');
const nowcap = document.getElementById('nowcap');
const phoneCap = document.getElementById('phoneCap');
const zoneTxt = document.getElementById('zoneTxt');
const dur = () => audio.duration || aligned.at(-1).start + 1;
function seek(t) { if (t == null) return; audio.currentTime = Math.max(0, t - 0.05); audio.play().catch(() => {}); }
playBtn.addEventListener('click', () => audio.paused ? audio.play().catch(() => {}) : audio.pause());
audio.addEventListener('play', () => playBtn.textContent = '❚❚ 일시정지');
audio.addEventListener('pause', () => playBtn.textContent = '▶ 내레이션 재생');

let lastKey = '';
function tick() {
  const t = audio.currentTime;
  clock.textContent = `${t.toFixed(1)} / ${dur().toFixed(1)}초`;
  head.style.left = `${(t / dur()) * 100}%`;
  // Current beat and word from the aligned starts.
  let cb = null, cw = null;
  beats.forEach(b => b.words.forEach(wd => { if (wd.t != null && wd.t <= t) { cb = b; cw = wd; } }));
  const next = cb && beats[beats.indexOf(cb) + 1];
  const inPause = cb && cw === cb.words.at(-1) && (!next || t < next.words[0].t) && t > cw.t + 0.6;
  const key = `${cb?.id}|${cw?.w}|${inPause}`;
  if (key !== lastKey) {
    lastKey = key;
    document.querySelectorAll('.live').forEach(e => e.classList.remove('live'));
    document.querySelectorAll('.seg.on').forEach(e => e.classList.remove('on'));
    if (cb) {
      cb.seg.classList.add('on');
      (inPause ? cb.pauseEl : cw.el).classList.add('live');
      const wi = cb.words.indexOf(cw);
      const cap = cb.capEls.filter(c => c.idx != null && c.idx !== -1 && c.idx <= wi).at(-1);
      nowcap.replaceChildren(); phoneCap.replaceChildren();
      if (cap) { cap.el.classList.add('live'); nowcap.append(rich(cap.text)); phoneCap.append(rich(cap.text)); }
      zoneTxt.textContent = `${cb.id} ${cb.name}`;
    }
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
